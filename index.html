
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikaner Express Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8ed;
      margin: 0;
      padding: 20px;
      color: #382417;
    }
    .card {
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px #0001;
    }
    h1 { color: #a94313; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #d8c8b8; }
    button {
      background: #a94313;
      color: white;
      border: 0;
      font-weight: bold;
    }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛵 Bikaner Express</h1>
    <h2>Admin Login</h2>
    <p>यहाँ केवल Admin लॉगिन करें।</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDhumnH7lRnz_LVJLTMklksusBPaDAkCh4",
    authDomain: "bikaner-express-537a2.firebaseapp.com",
    databaseURL: "https://bikaner-express-537a2-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "bikaner-express-537a2",
    storageBucket: "bikaner-express-537a2.firebasestorage.app",
    messagingSenderId: "852964791053",
    appId: "1:852964791053:web:94c129e58b72a375661644"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const auth = firebase.auth();
  const db = firebase.database();
  const ADMIN_UID = "i8dtxW327zN1onqskZ7MfK3QDcc2";

  document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Login ho raha hai...";

    try {
      const result = await auth.signInWithEmailAndPassword(email, password);

      if (result.user.uid !== ADMIN_UID) {
        await auth.signOut();
        message.textContent = "Access denied: yeh Admin account nahi hai.";
        return;
      }

      
message.textContent = "Admin login successful!";

document.getElementById("loginForm").style.display = "none";
document.getElementById("ordersDashboard").style.display = "block";
document.getElementById("ordersMessage").textContent =
  "Login ho gaya. Ab Firebase se orders load karenge.";

    } catch (error) {
      console.error(error);
      message.textContent = "Login nahi hua. Email, password aur Firebase settings check karein.";
    }
  });
</script>

<section id="ordersDashboard" style="display:none; max-width:900px; margin:20px auto; padding:20px; background:white; border-radius:12px;">
  <h2>📦 Customer Orders</h2>
  <p>यहाँ ग्राहकों के ऑर्डर दिखाई देंगे।</p>
  <button id="refreshOrders" type="button">🔄 Orders Refresh करें</button>
  <p id="ordersMessage" role="status">Orders लोड होने की प्रतीक्षा है...</p>
  <div id="ordersList"></div>
</section>


</body>
</html>
