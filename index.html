
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bikaner Express Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8ed;
      margin: 0;
      padding: 20px;
      color: #382417;
    }
    .card {
      max-width: 500px;
      margin: 40px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px #0001;
    }
    h1 { color: #a94313; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #d8c8b8; }
    button {
      background: #a94313;
      color: white;
      border: 0;
      font-weight: bold;
    }
    #message { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛵 Bikaner Express</h1>
    <h2>Admin Login</h2>
    <p>यहाँ केवल Admin लॉगिन करें।</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Admin email" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>
</body>
</html>
